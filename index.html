<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="World Manager">
<meta name="theme-color" content="#0f151c">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>World Manager</title>
<style>
:root {
  --bg: #0f151c; --bar: #121a22; --card: #18222d; --card2: #223040; --line: #263444;
  --text: #ecf1f6; --muted: #aab7c4; --faint: #7d8b99; --lift: none;
  --accent: #e9a23b; --accent-ink: #1e1404; --teal: #4fb3bf;
  --danger: #ef6158; --good: #3fb950; --bless: #d9ae3c; --afflict: #ef6158; --magic: #a77bf3; --fert: #e06aa8;
  --glass: rgba(18, 26, 34, .78); --glass-strong: rgba(18, 26, 34, .94); --glass-line: rgba(255, 255, 255, .08);
  --shadow: 0 6px 24px rgba(0, 0, 0, .35);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f3f1ec; --bar: #fbfaf7; --card: #ffffff; --card2: #ece8e0; --line: #e0dacf;
    --text: #1b2127; --muted: #535e6a; --faint: #838d98; --lift: 0 1px 2px rgba(40, 30, 10, .07), 0 0 0 1px rgba(40, 30, 10, .05);
    --accent: #c97b12; --accent-ink: #fff; --teal: #1f8a96;
    --glass: rgba(251, 250, 247, .82); --glass-strong: rgba(251, 250, 247, .96); --glass-line: rgba(0, 0, 0, .08);
    --shadow: 0 6px 24px rgba(40, 30, 10, .16);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f3f1ec; --bar: #fbfaf7; --card: #ffffff; --card2: #ece8e0; --line: #e0dacf;
  --text: #1b2127; --muted: #535e6a; --faint: #838d98; --lift: 0 1px 2px rgba(40, 30, 10, .07), 0 0 0 1px rgba(40, 30, 10, .05);
  --accent: #c97b12; --accent-ink: #fff; --teal: #1f8a96;
  --glass: rgba(251, 250, 247, .82); --glass-strong: rgba(251, 250, 247, .96); --glass-line: rgba(0, 0, 0, .08);
  --shadow: 0 6px 24px rgba(40, 30, 10, .16);
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 16px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
body { overflow: hidden; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
canvas { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer;
  -webkit-user-select: none; user-select: none; touch-action: manipulation; }
button:disabled { opacity: .4; cursor: default; }
input, select, textarea { font: inherit; font-size: 16px; color: var(--text); background: var(--bg);
  border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; width: 100%; min-width: 0; }
textarea { resize: vertical; min-height: 84px; line-height: 1.4; }
input[type="checkbox"], input[type="radio"] { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
input[type="range"] { padding: 0; border: 0; background: none; accent-color: var(--accent); height: 28px; }
input:focus, select:focus, textarea:focus { outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 0; }
.ico { display: inline-grid; place-items: center; line-height: 0; }
.num { font-variant-numeric: tabular-nums; }

#app { position: fixed; inset: 0; display: flex; flex-direction: column; }
#topbar { flex: none; display: flex; align-items: center; gap: 10px; min-height: 50px; z-index: 6;
  padding: calc(env(safe-area-inset-top) + 6px) calc(env(safe-area-inset-right) + 10px) 6px calc(env(safe-area-inset-left) + 14px);
  background: var(--bar); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 9px; min-width: 0; flex: 1; background: none; border: 0; padding: 4px 0; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.brand-text { display: flex; flex-direction: column; min-width: 0; line-height: 1.15; }
#brand-sub { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#brand-sub:empty { display: none; }
.brand-chev { transform: rotate(90deg); color: var(--muted); flex: none; }
.brand .logo { color: var(--accent); }
#campaign-name { font-weight: 700; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.date-chip { display: inline-flex; align-items: center; gap: 7px; padding: 7px 11px; border-radius: 999px;
  background: var(--card); border: 1px solid var(--line); font-size: 14px; font-weight: 600; white-space: nowrap; }
.date-chip .ico { color: var(--accent); }
.date-lines { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.15; }
.top-save { color: var(--text); margin-right: -4px; }
.save-row { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.save-row:last-child { border-bottom: 0; }
.save-thumb { width: 84px; height: 56px; border-radius: 9px; object-fit: cover; flex: none; background: var(--card2); display: grid; place-items: center; color: var(--muted); }
.save-row .main { flex: 1; min-width: 0; }
.save-row .title { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.save-row .sub { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.save-row .acts { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
#date-earth { font-size: 11.5px; font-weight: 650; color: var(--teal); }
#date-earth:empty { display: none; }
.earth-hint { color: var(--teal); font-weight: 600; margin-top: 4px; }
main { flex: 1; position: relative; min-height: 0; }
.view { position: absolute; inset: 0; display: none; }
.view.active { display: block; }
#tabbar { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); z-index: 6; background: var(--bar);
  border-top: 1px solid var(--line);
  padding: 3px env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 3px) env(safe-area-inset-left); }
#tabbar button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 0 4px; font-size: 11.5px;
  color: var(--muted); font-weight: 600; }
#tabbar button.active { color: var(--accent); }

/* ---------- buttons, cards, forms ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 9px 15px; min-height: 42px; border-radius: 12px;
  background: var(--card2); color: var(--text); font-weight: 600; font-size: 15px; border: 1px solid transparent; white-space: nowrap; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.danger { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, var(--card2)); }
.btn.ghost { background: transparent; }
.btn.danger-fill { background: var(--danger); color: #fff; border-color: transparent; }
.btn.small { padding: 6px 12px; min-height: 36px; font-size: 14px; border-radius: 10px; gap: 6px; }
.btn.block { width: 100%; }
.icon-btn { width: 40px; height: 40px; display: inline-grid; place-items: center; border-radius: 10px; color: var(--muted); flex: none; }
.icon-btn:active, .btn:active { filter: brightness(1.15); }
.card { background: var(--card); border: 1px solid transparent; border-radius: 16px; padding: 14px 16px; margin: 12px 0; box-shadow: var(--lift); }
.card h3 { margin: 0 0 10px; font-size: 16px; color: var(--text); font-weight: 700; min-height: 32px;
  display: flex; align-items: center; gap: 8px; }
.card h3 > .ico:first-child { color: var(--muted); }
.card h3 .grow { flex: 1; }
.field { display: flex; flex-direction: column; gap: 6px; margin: 14px 0; }
.field > span, .lbl { font-size: 14px; color: var(--muted); font-weight: 600; }
.field > .tiny.muted, .field > .small.muted { line-height: 1.4; }
.grp-title { font-size: 13px; font-weight: 700; color: var(--muted); margin: 18px 0 2px; }
.row { display: flex; gap: 8px; align-items: center; }
.row > .grow { flex: 1; min-width: 0; }
.row.wrap { flex-wrap: wrap; }
.cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.cols3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.check { display: flex; align-items: center; gap: 12px; padding: 10px 0; min-height: 44px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 14px; }
.tiny { font-size: 12.5px; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
  background: var(--card2); color: var(--muted); white-space: nowrap; }
.badge.fert { background: color-mix(in srgb, var(--fert) 22%, transparent); color: var(--fert); }
.badge.afflict { background: color-mix(in srgb, var(--afflict) 20%, transparent); color: var(--afflict); }
.badge.bless { background: color-mix(in srgb, var(--bless) 22%, transparent); color: var(--bless); }
.badge.magic { background: color-mix(in srgb, var(--magic) 22%, transparent); color: var(--magic); }
.badge.down { background: var(--danger); color: #fff; }
.seg { display: flex; background: var(--bg); border: 0; border-radius: 12px; padding: 3px; gap: 2px; overflow-x: auto;
  scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { flex: 1; padding: 8px 10px; min-height: 36px; border-radius: 9px; font-size: 14px; color: var(--muted); white-space: nowrap; font-weight: 600;
  display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
.seg button.on { background: var(--card2); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.22); }
@media (max-width: 430px) { .seg button { padding: 8px 6px; font-size: 13.5px; } .seg button .ico { display: none; } }
.empty { text-align: center; color: var(--muted); padding: 28px 12px; }
.empty .big { font-size: 18px; color: var(--text); font-weight: 650; margin-bottom: 6px; }
.list-row { display: flex; align-items: center; gap: 12px; padding: 10px 2px; border-bottom: 1px solid var(--line); min-height: 52px; }
.list-row:last-child { border-bottom: 0; }
.list-row .main { flex: 1; min-width: 0; }
.list-row .title { font-weight: 620; overflow: hidden; text-overflow: ellipsis; }
.list-row .sub { font-size: 13.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.list-row > .ico:last-child { color: var(--faint); }
.tap { cursor: pointer; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch { width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; }
.swatch.on { border-color: var(--text); }
.stepper { display: inline-flex; align-items: center; border: 0; border-radius: 11px; overflow: hidden; background: var(--card2); }
.stepper button { width: 40px; height: 38px; display: grid; place-items: center; color: var(--text); }
.stepper input { width: 64px; border: 0; border-radius: 0; text-align: center; padding: 6px 2px; background: transparent; }
.stepper .val { min-width: 34px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 650; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 7px 13px; min-height: 34px; border-radius: 999px; background: var(--card2); border: 0; font-size: 14px; font-weight: 600; }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.chip.neg { color: var(--danger); }
.chip.pos { color: var(--good); }
.progress { height: 8px; border-radius: 4px; background: var(--card2); overflow: hidden; }
.progress > i { display: block; height: 100%; border-radius: 4px; background: var(--accent); }
hr.sep { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }

/* ---------- sheets & toasts ---------- */
#sheet-root { position: relative; z-index: 40; }
.sheet-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center;
  animation: fadein .15s ease; }
.sheet { width: 100%; max-width: 600px; max-height: 86vh; max-height: calc(100dvh - env(safe-area-inset-top) - 24px); background: var(--bar);
  border-radius: 18px 18px 0 0; display: flex; flex-direction: column; box-shadow: var(--shadow);
  padding-bottom: env(safe-area-inset-bottom); animation: sheetup .22s cubic-bezier(.2,.8,.2,1); }
.sheet.wide { max-width: 760px; }
@media (min-width: 720px) { .sheet-backdrop { align-items: center; } .sheet { border-radius: 18px; max-height: 88vh; max-height: 88dvh; } }
.sheet-head { display: flex; align-items: center; padding: 14px 10px 8px 18px; gap: 8px; }
.sheet-title { font-weight: 750; font-size: 18.5px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet-body { overflow-y: auto; padding: 2px 18px 18px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.sheet-foot { display: flex; gap: 8px; padding: 12px 18px 14px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.sheet-foot .spacer { flex: 1; }
@keyframes sheetup { from { transform: translateY(40px); opacity: 0; } }
@keyframes fadein { from { opacity: 0; } }
#toast-root { position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top) + 58px); display: flex; flex-direction: column;
  align-items: center; gap: 6px; pointer-events: none; z-index: 100; }
.toast { background: rgba(16,22,30,.96); color: #f2f5f8; padding: 11px 16px; border-radius: 14px; font-size: 15px; max-width: 92vw;
  box-shadow: 0 6px 20px rgba(0,0,0,.35); animation: sheetup .2s ease; }

/* ---------- map ---------- */
#map-canvas, #tl-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#view-map { background: #0b1016; }
.glass { background: var(--glass); -webkit-backdrop-filter: blur(14px) saturate(1.2); backdrop-filter: blur(14px) saturate(1.2);
  border: 1px solid var(--glass-line); box-shadow: 0 2px 12px rgba(0,0,0,.22); }
.fab-col { position: absolute; right: calc(env(safe-area-inset-right) + 10px); top: 10px; display: flex; flex-direction: column; gap: 8px; z-index: 2; }
.fab { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; color: var(--text); }
.fab.on { color: var(--accent); }
.map-readout { position: absolute; left: calc(env(safe-area-inset-left) + 10px); top: 10px; z-index: 2; pointer-events: none;
  font-size: 13px; line-height: 1.4; padding: 7px 11px; border-radius: 11px; max-width: calc(100% - 80px); }
@media (max-width: 600px) { .map-readout .mode-pill, .map-readout .ro-ratio { display: none; } }
@media (pointer: coarse) { .fab[data-act="zin"], .fab[data-act="zout"] { display: none; } }
.map-readout b { font-weight: 650; }
.tools { position: absolute; left: 50%; transform: translateX(-50%); bottom: 10px; display: flex; gap: 2px; padding: 4px;
  border-radius: 15px; z-index: 3; }
.tools button { width: 52px; height: 52px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; color: var(--muted); font-size: 11px; font-weight: 600; line-height: 1; }
.tools button .tl { white-space: nowrap; }
.tools button.on { background: var(--accent); color: var(--accent-ink); }
.map-panel { position: absolute; left: 10px; right: 10px; bottom: 74px; max-width: 560px; margin: 0 auto; padding: 12px 14px 14px;
  border-radius: 18px; z-index: 3; display: none; background: var(--glass-strong); max-height: calc(100% - 150px); overflow-y: auto; overscroll-behavior: contain; }
.map-panel.show { display: block; animation: sheetup .18s ease; }
.map-panel .row + .row { margin-top: 8px; }
.map-panel label.lbl { min-width: 62px; }
.biome-grid { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: thin; }
.biome-sw { flex: none; display: flex; flex-direction: column; align-items: center; gap: 4px; width: 66px; font-size: 11.5px; color: var(--muted);
  text-align: center; line-height: 1.15; }
.biome-sw i { width: 38px; height: 38px; border-radius: 10px; border: 2px solid transparent; display: block; }
.biome-sw.on { color: var(--text); font-weight: 650; }
.biome-sw.on i { border-color: var(--text); box-shadow: 0 0 0 2px var(--accent); }
.biome-sw i.stamp-ic { background: var(--card2); color: var(--text); display: grid; place-items: center; }
.biome-sw.on i.stamp-ic { color: var(--accent); }
@media (max-width: 400px) { .tools button { width: 47px; font-size: 10.5px; } }
.map-chip { position: absolute; left: 10px; right: 10px; bottom: 74px; max-width: 560px; margin: 0 auto; z-index: 3; padding: 12px 14px;
  border-radius: 18px; display: none; background: var(--glass-strong); font-size: 14.5px; }
.map-chip.show { display: block; animation: sheetup .18s ease; }
.map-chip .k { color: var(--muted); }
.map-busy { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); z-index: 2; font-size: 13px; padding: 4px 10px;
  border-radius: 999px; pointer-events: none; opacity: 0; transition: opacity .25s; }
.map-busy.show { opacity: 1; }
.mode-pill { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); }
#view-map.framing .fab-col, #view-map.framing .tools, #view-map.framing .map-readout, #view-map.framing .map-chip { display: none; }
#view-map.framing .map-panel { bottom: 12px; }

/* ---------- characters ---------- */
.chars-wrap { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr; }
@media (min-width: 860px) { .chars-wrap { grid-template-columns: 360px 1fr; } }
.pane { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 12px 16px 32px; min-height: 0; }
.list-pane { border-right: 1px solid var(--line); }
@media (max-width: 859px) {
  .chars-wrap.detail .list-pane { display: none; }
  .chars-wrap:not(.detail) .detail-pane { display: none; }
}
@media (min-width: 860px) { .back-btn { display: none !important; } }
.pane-head { display: flex; align-items: center; gap: 8px; margin: 2px 0 8px; }
.pane-head h2 { margin: 0; font-size: 24px; font-weight: 750; letter-spacing: -.01em; flex: 1; }
.char-card { display: flex; gap: 12px; align-items: center; cursor: pointer; }
.char-card.sel { border-color: var(--accent); }
.avatar { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 750; color: #14100a; flex: none; font-size: 16px; }
.avatar.lg { width: 58px; height: 58px; font-size: 21px; }
.char-card .main { flex: 1; min-width: 0; }
.char-card .name { font-weight: 700; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.char-card .sub { font-size: 13.5px; color: var(--muted); margin-bottom: 6px; }
.hpbar { height: 8px; border-radius: 4px; background: var(--card2); overflow: hidden; position: relative; }
.hpbar > i { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 4px; }
.hpbar > b { position: absolute; top: 0; bottom: 0; border-radius: 4px; background: #79c0ff; opacity: .85; }
.hp-big { font-size: 38px; font-weight: 750; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.05; }
.hp-big small { font-size: 17px; color: var(--muted); font-weight: 600; }
.cond { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.cond:last-child { border-bottom: 0; }
.cond .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; flex: none; }
.cond .main { flex: 1; min-width: 0; }
.cond .title { font-weight: 640; }
.cond .sub { font-size: 13.5px; color: var(--muted); }
.item-row { display: flex; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); }
.item-row:last-child { border-bottom: 0; }
.item-row .main { flex: 1; min-width: 0; cursor: pointer; }
.item-row .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item-row .sub { font-size: 13px; color: var(--muted); }
.cat-head { font-size: 13px; color: var(--muted); font-weight: 700; margin: 14px 0 2px; }
.uses { display: inline-flex; gap: 3px; vertical-align: middle; }
.uses i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--magic); display: inline-block; }
.uses i.full { background: var(--magic); }
.ring { position: relative; width: 74px; height: 74px; flex: none; }
.ring svg { position: absolute; inset: 0; }
.ring .c { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; text-align: center; line-height: 1.15; font-weight: 650; white-space: pre-line; }
.roll-result { font-size: 30px; font-weight: 800; text-align: center; padding: 10px 0 4px; letter-spacing: -.01em; }
.roll-result.yes { color: var(--fert); }
.roll-result.no { color: var(--muted); }
.breakdown { font-size: 14px; }
.breakdown .row { justify-content: space-between; padding: 3px 0; border-bottom: 1px dashed var(--line); }
.breakdown .row:last-child { border-bottom: 0; font-weight: 750; font-size: 14.5px; }

/* ---------- timeline ---------- */
#view-timeline { background: var(--bg); }
.tl-bar { position: absolute; left: 50%; transform: translateX(-50%); bottom: 10px; display: flex; gap: 2px; padding: 4px;

self.onmessage = function (e) {

// a square portrait from the photo library or camera, as a small JPEG
function pickImage(maxPx = 256) {
  return new Promise(res => {
    const inp = h('input', { type: 'file', accept: 'image/*', style: 'display:none' });
    let done = false;
    const fin = v => { if (done) return; done = true; inp.remove(); res(v); };
    inp.addEventListener('cancel', () => fin(null));
    inp.addEventListener('change', async () => {
      const f = inp.files && inp.files[0]; if (!f) return fin(null);
      const url = URL.createObjectURL(f);
      try {
        const img = new Image(); img.src = url; await img.decode();
        const s = Math.min(img.naturalWidth, img.naturalHeight), c = document.createElement('canvas');
        c.width = c.height = Math.min(maxPx, s);
        c.getContext('2d').drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, c.width, c.height);
        fin(c.toDataURL('image/jpeg', 0.82));
      } catch (e) { toast('Could not read that image'); fin(null); }
      finally { URL.revokeObjectURL(url); }
    });
    document.body.append(inp); inp.click();
  });
}

/* ===================== storage ===================== */
const Store = (() => {
  let db = null, useLS = false;
  function open() {
    return new Promise((res, rej) => {
      try {
        const r = indexedDB.open('world-manager', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
        r.onblocked = () => rej(new Error('blocked'));
      } catch (e) { rej(e); }
    });
  }
  return {
    async init() { try { db = await open(); } catch (e) { console.warn('IndexedDB unavailable, using localStorage', e); useLS = true; } },
    get(k) {
      if (useLS) { try { const s = localStorage.getItem('wm:' + k); return Promise.resolve(s ? JSON.parse(s) : undefined); } catch (e) { return Promise.resolve(undefined); } }
      return new Promise((res, rej) => { const rq = db.transaction('kv', 'readonly').objectStore('kv').get(k); rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); });
    },
    set(k, v) {
      if (useLS) { localStorage.setItem('wm:' + k, JSON.stringify(v)); return Promise.resolve(); }
      return new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); });
    },
    del(k) {
      if (useLS) { try { localStorage.removeItem('wm:' + k); } catch (e) {} return Promise.resolve(); }
      return new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').delete(k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); });
    },
    get kind() { return useLS ? 'localStorage' : 'IndexedDB'; },
  };
})();

// write a world to a .json file: the share sheet on iPhone/iPad (Save to Files), a download elsewhere
async function downloadWorld(st, label) {
  const json = JSON.stringify({ app: 'world-manager', format: 1, exported: new Date().toISOString(), name: label || st.meta.name, state: st });
  const slug = (label || st.meta.name || 'world').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60) || 'world';
  const name = `${slug}-${new Date().toISOString().slice(0, 10)}.json`;
  const blob = new Blob([json], { type: 'application/json' });
  const touch = navigator.maxTouchPoints > 0 && /iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent);
  if (touch && navigator.canShare) {
    try { const f = new File([blob], name, { type: 'application/json' }); if (navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: name }); return; } }
    catch (e) { if (e && e.name === 'AbortError') return; }

  document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 5000);

}

function parseCoords(q) {

  if (m[2] && /s/i.test(m[2])) la = -Math.abs(la);
  if (m[4] && /w/i.test(m[4])) lo = -Math.abs(lo);

}

    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); cur = clamp(cur + (e.key === 'ArrowDown' ? 1 : -1), 0, Math.max(0, rows.length - 1)); mark(); if (rows[cur]) rows[cur].el.scrollIntoView({ block: 'nearest' }); }
    else if (e.key === 'Enter') { e.preventDefault(); if (rows[cur]) run(rows[cur].r); }
  });
  sh = openSheet({ title: 'Search', wide: true, body: h('div', null, inp, list) });
  sh.el.classList.add('pal');
  draw();
  setTimeout(() => inp.focus(), 40);
}
function shortcutsSheet() {
  const K = (keys, what) => [h('div', null, keys.split(' ').flatMap((k, i) => (i ? [' ', h('kbd', null, k)] : [h('kbd', null, k)]))), h('div', null, what)];
  openSheet({ title: 'Keyboard shortcuts', body: h('div', null, h('div', { class: 'keys' },
    K('/', 'Search everything'), K('Ctrl+K', 'Search (⌘K on a Mac)'), K('R', 'Dice roller'), K('1 2 3 4 5', 'Map · Characters · Timeline · Codex · Settings'),
    K('N', 'New thing on this tab'), K('[ ]', 'Campaign date back or forward a day'), K('{ }', 'Back or forward a week'), K('D', 'Campaign date & almanac'),
    K('P', 'Party sheet'), K('Ctrl+S', 'Save a snapshot'), K('Esc', 'Close the top sheet'),
    K('+ −', 'Map: zoom in or out'), K('H', 'Map: whole planet'), K('Ctrl+Z', 'Map: undo the last edit'), K('Ctrl+Shift+Z', 'Map: redo'), K('?', 'This list')),
    h('p', { class: 'tiny muted', style: 'margin-top:14px' }, 'On iPhone and iPad, the search and dice buttons sit in the top bar.')) });
}
function newInTab() {
  const t = S.ui.tab;
  if (t === 'chars') Chars.add();
  else if (t === 'timeline') Timeline.editEvent(null, S.meta.today);
  else if (t === 'codex') Codex.create();
  else if (t === 'map') MapView.editPlace(null, MapView.centerLL());
}

/* ===================== app shell ===================== */
const Views = { map: MapView, chars: Chars, timeline: Timeline, codex: Codex, settings: Settings };
function setTab(t) {
  if (!Views[t]) t = 'map';
  S.ui.tab = t;
  for (const v of $$('.view')) v.classList.toggle('active', v.id === 'view-' + t);
  for (const b of $$('#tabbar button')) b.classList.toggle('active', b.dataset.tab === t);
  for (const [k, v] of Object.entries(Views)) if (k !== t && v.hide) v.hide();
  Views[t].show();
  save();
}
function applyTheme() {
  const t = S.meta.theme;
  if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme');
}
function fillIcons(root = document) { for (const el of $$('[data-icon]', root)) { el.classList.add('ico'); el.innerHTML = iconSVG(el.dataset.icon, +el.dataset.size || 20); } }
function seedStarter() {
  // a landing site on temperate lowland near the middle of the map, and the founding event at 0 CS
  let rs = 1234567; const rnd = () => ((rs = (Math.imul(rs, 1103515245) + 12345) >>> 0) / 4294967296);
  let best = null, bestScore = -Infinity;
  for (let k = 0; k < 700; k++) {
    const lat = (rnd() * 2 - 1) * 55, lon = (+S.world.cm || 0) + (rnd() * 2 - 1) * 110;
    const s = Terrain.sample(lat, lon);
    if (s.elev < 8 || s.elev > 900) continue;
    const score = ([4, 6, 7, 11].includes(s.biome) ? 2 : 0) - Math.abs(Math.abs(lat) - 28) / 40 - Math.abs(s.elev - 150) / 700;
    if (score > bestScore) { bestScore = score; best = [lat, lon]; }
  }
  let pl = null;
  if (best) { pl = { id: uid(), name: 'First Landing', type: 'capital', lat: +best[0].toFixed(5), lon: +Terrain.normLon(best[1]).toFixed(5), notes: 'Where the colony began.', always: true }; S.world.places.push(pl); }
  S.events.push({ id: uid(), title: 'Colony founded', start: 0, end: null, cat: 'History', desc: 'Year zero of the Colony Standard calendar.', chars: [], place: pl ? pl.id : null });
  catColor('History');
  S.meta.seeded = true;
  save();
}
async function boot() {
  fillIcons();
  await Store.init();
  let st = null;
  try { st = await Store.get('state'); } catch (e) { console.error(e); }
  S = migrate(st || defaultState());
  applyTheme(); refreshDate();
  MapView.init();
  if (!S.meta.seeded) seedStarter();
  Chars.init(); Timeline.init(); Codex.init(); Settings.render();
  for (const b of $$('#tabbar button')) b.addEventListener('click', () => setTab(b.dataset.tab));
  $('#date-chip').addEventListener('click', openDateSheet);
  $('#save-btn').addEventListener('click', openSavesSheet);
  $('#brand-btn').addEventListener('click', openWorldsSheet);
  $('#search-btn').addEventListener('click', () => openSearch());
  $('#dice-btn').addEventListener('click', () => Dice.sheet());
  document.addEventListener('keydown', e => {
    const k = e.key, mod = e.ctrlKey || e.metaKey;
    if (mod && !e.altKey && k.toLowerCase() === 's') { e.preventDefault(); quickSave(); return; }
    if (mod && !e.altKey && k.toLowerCase() === 'k') { e.preventDefault(); openSearch(); return; }
    if (mod || e.altKey || isTyping(e.target) || sheetStack.length) return;
    const acts = { '/': () => openSearch(), '?': shortcutsSheet, r: () => Dice.sheet(), n: newInTab, p: () => Chars.partySheet(), d: openDateSheet,
      ']': () => stepDay(1), '[': () => stepDay(-1), '}': () => stepDay(7), '{': () => stepDay(-7),
      1: () => setTab('map'), 2: () => setTab('chars'), 3: () => setTab('timeline'), 4: () => setTab('codex'), 5: () => setTab('settings') };
    const f = acts[k] || acts[k.toLowerCase()];
    if (f) { e.preventDefault(); f(); }
  });
  on('today', () => { if (S.ui.tab === 'settings') Settings.render(); });
  on('data', () => { refreshDate(); if (S.ui.tab === 'settings') Settings.render(); });
  // a daily safety snapshot, taken once the map has drawn so it gets a thumbnail
  setTimeout(async () => {
    try {
      const w = S.world, used = S.chars.length || S.events.length > 1 || w.places.length > 1 || w.features.length || w.sculpt.length || w.paint.length;
      const last = (await Saves.list()).find(x => x.kind === 'auto');
      if (used && (!last || Date.now() - last.at > 20 * 3600e3)) await Saves.autoSave('Daily backup');
    } catch (e) { console.warn('Daily backup skipped', e); }
  }, 6000);
  setTab(S.ui.tab || 'map');
  if (S.ui.after) {   // just crossed to this world
    const a = S.ui.after, p = a.place && S.world.places.find(x => x.id === a.place);
    delete S.ui.after; save();
    if (a.hello) toast(`On ${S.world.name}`);
    if (p) setTimeout(() => { MapView.flyTo(p.lat, p.lon, MapView.placeWidth(p)); if (a.open) setTimeout(() => MapView.openPlace(p), 450); }, 350);
  }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(e => console.warn('Service worker not registered', e));
}
boot();

</script>
